services:
  backend:
    build: .
    container_name: houseplant-backend
    ports:
      - "4000:4000"

    volumes:
      - ./certs:/app/certs:ro

    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      VERSION: ${VERSION}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      HOST: ${HOST}
      MAIL_PORT: ${MAIL_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

    restart: unless-stopped


    