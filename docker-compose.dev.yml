# for development
services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    
    container_name: houseplant-backend-devlopment

    ports:
      - "4000:4000"

    volumes:
      # Mount source code for live development
      - .:/app

      # Keep container's node_modules
      - /app/node_modules

      # Mount certificates read-only
      - ./certs:/app/certs:ro

    environment:
      NODE_ENV: development
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      VERSION: ${VERSION}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      HOST: ${HOST}
      MAIL_PORT: ${MAIL_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FRONTEND_URL: ${FRONTEND_URL}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    

    cap_drop:
      - ALL
    
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1"
    #       memory: 512M

    command: npm run dev

    restart: unless-stopped