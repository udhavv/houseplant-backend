name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow}}-${{ github.ref}}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        name: code quality check
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci --prefer-offline

            - name: Run linter
              run: npm run lint

    test-and-build:
        name: test and build stage
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: lint
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Run tests
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: npm test


            # - name: build application
            #   run: npm run build

  